name: Build Fishing Mod
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Gradle 8.1.1
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.1.1-bin.zip
          unzip -q gradle-8.1.1-bin.zip

      - name: Generate wrapper and build
        run: |
          gradle-8.1.1/bin/gradle wrapper --gradle-version 8.1.1
          ./gradlew build --no-daemon || (rm -rf ~/.gradle/caches/forge_gradle && ./gradlew build --no-daemon)

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: fishing-mod-jar-1.20.1
          path: build/libs/*.jar
          retention-days: 7
